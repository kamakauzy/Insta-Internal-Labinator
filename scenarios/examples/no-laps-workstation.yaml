# ═══════════════════════════════════════════════════════════════════════════
# Scenario: No-LAPS Workstation Takeover
# SMB relay + share secrets on an unpatched workstation
# ═══════════════════════════════════════════════════════════════════════════
name: No-LAPS Workstation Takeover
description: >
  Classic assumed-breach scenario: Windows workstation with SMB enabled,
  no LAPS, SMB signing disabled, and a share full of passwords. Can you
  relay your way to Domain Admin?
difficulty: easy
author: labinator
tags: [smb, relay, laps, workstation, beginner]

machines:
  - name: WS01
    role: workstation
    target_vm: srv02
    services:
      - name: smb
        signing: false
        shares: [Finance, IT-Backup]
      - rdp
    vulnerabilities:
      - no_laps
      - smb_signing_disabled
      - llmnr_enabled
      - id: share_with_passwords
        share_name: IT-Backup
      - autologon_credentials
      - psremoting_open

  - name: DC01
    role: domain_controller
    target_vm: dc01
    services:
      - ldap
      - dns
    vulnerabilities:
      - id: kerberoastable_spns
        accounts: [svc_backup]
      - null_sessions
      - print_spooler_on_dc

objectives:
  - "Use LLMNR poisoning to capture NTLMv2 hashes"
  - "Relay captured hashes via SMB (signing disabled)"
  - "Find plaintext passwords in the IT-Backup share"
  - "Abuse PrinterBug to coerce DC authentication"
  - "Achieve Domain Admin via relay chain"
