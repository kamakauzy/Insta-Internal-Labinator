# ═══════════════════════════════════════════════════════════════════════════
# Scenario: Cloud Credential Hunt
# Find AWS/Azure secrets buried in Windows file shares
# ═══════════════════════════════════════════════════════════════════════════
name: Cloud Credential Hunt
description: >
  A DevOps team left cloud credentials scattered across file shares.
  Find the AWS keys, Azure service principal, and SSH keys to prove
  the blast radius of a single compromised workstation.
difficulty: easy
author: labinator
tags: [cloud, credentials, shares, beginner]

machines:
  - name: FILE-SRV01
    role: file_server
    target_vm: srv02
    services:
      - name: smb
        signing: false
        shares: [DevOps-Backup, Admin-Tools, Finance]
      - rdp
    vulnerabilities:
      - id: share_with_aws_keys
        share_name: DevOps-Backup
        profile: prod
      - id: share_with_ssh_keys
        share_name: Admin-Tools
      - id: share_with_azure_tokens
      - id: share_with_passwords
        share_name: Finance
      - smb_signing_disabled
      - no_laps

  - name: DC01
    role: domain_controller
    target_vm: dc01
    services:
      - ldap
      - dns
    vulnerabilities:
      - id: kerberoastable_spns
        accounts: [svc_devops, svc_deploy]
      - id: asrep_roastable
        accounts: [dev.intern]
      - password_in_description

objectives:
  - "Find AWS access keys in a file share"
  - "Recover Azure service principal credentials"
  - "Locate SSH private keys with associated host config"
  - "Crack a Kerberoastable service account"
  - "Chain credentials to reach Domain Admin"
